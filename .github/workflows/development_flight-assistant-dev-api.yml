# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - flight-assistant-dev-api

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Add EF to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        
      - name: Apply EF Core migrations
        env:
          CONNECTION_STRING: ${{ github.ref_name == 'development' && secrets.DEV_DB_CONNECTION_STRING
            || github.ref_name == 'staging' && secrets.STAGE_DB_CONNECTION_STRING
            || secrets.PROD_DB_CONNECTION_STRING }}
        run: >
          dotnet ef database update
          -p FlightAssistant.Infrastructure
          -s FlightAssistant.API
          --connection "$CONNECTION_STRING"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A971F90AC92D4F99911760AE30959DCE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_151F54432FBD465486413E352411B32D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F8393502DB1F4EEB90642AB89A6FBED7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flight-assistant-dev-api'
          slot-name: 'Production'
          package: .

          

