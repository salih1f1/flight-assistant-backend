# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - flight-assistant-dev-api

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    env:
      CONNECTION_STRING: ${{ secrets.DEV_DB_CONNECTION_STRING }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # -p:SourceRevisionId stamps AssemblyInformationalVersionAttribute with
      # "+<sha>", which GET /admin/health parses back out as buildSha (see
      # AdminHealthReportBuilder.ParseVersion). This step must actually build —
      # adding --no-build here (e.g. to reuse the "Build with dotnet" step above)
      # would silently drop the stamp, and buildSha would go null in production
      # with nothing failing to flag it.
      - name: dotnet publish
        run: >
          dotnet publish FlightAssistant.API -c Release -o ${{env.DOTNET_ROOT}}/myapp
          -p:SourceRevisionId=${{ github.sha }}

      # spec/openapi.json (committed, #324) is the source of truth; ci.yml's
      # drift check is what guarantees it matches on every PR. This step only
      # keeps producing the same run-scoped artifact this workflow always has.
      # scripts/generate-openapi.sh is what that drift check calls too — the
      # dummy configuration block it injects to boot the host (AeroApiOptions.ApiKey
      # is [Required] and validated on start, so the export won't start without
      # *something*; generating the spec makes no outbound call) lives there once,
      # not copied into this workflow as well.
      - name: Export OpenAPI spec
        run: scripts/generate-openapi.sh openapi.json ${{env.DOTNET_ROOT}}/myapp

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Add EF to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        
      - name: Build EF migration bundle
        run: >
          dotnet ef migrations bundle
          --project FlightAssistant.Infrastructure
          --startup-project FlightAssistant.API
          --configuration Release
          --output efbundle
    
      - name: Upload efbundle artifact 
        uses: actions/upload-artifact@v4
        with: { name: efbundle, path: efbundle }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    env:
      CONNECTION_STRING: ${{ secrets.DEV_DB_CONNECTION_STRING }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Download efbundle artifact
        uses: actions/download-artifact@v4
        with:
          name: efbundle
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A971F90AC92D4F99911760AE30959DCE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_151F54432FBD465486413E352411B32D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F8393502DB1F4EEB90642AB89A6FBED7 }}

      - name: Apply EF Core migrations (bundle)
        env:
          CONNECTION_STRING: ${{ env.CONNECTION_STRING }}
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "$CONNECTION_STRING"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flight-assistant-dev-api'
          slot-name: 'Production'
          package: .

          





