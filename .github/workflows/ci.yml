# Verification-only workflow. Runs on every pull request and on pushes to the
# long-lived branches.
#
# Deliberately separate from development_flight-assistant-dev-api.yml rather than
# adding a pull_request trigger there: that workflow holds Azure credentials and
# applies an EF migration bundle to the dev database. Neither should ever be
# reachable from a pull request, including one opened from a fork.
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

# A new push to a PR branch makes the in-flight run obsolete. Don't spend runners
# finishing it. Never cancel a run on development/main — those are the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build --configuration Release

      # FlightAssistant.Infrastructure.Tests spins up real PostgreSQL via Testcontainers (#295),
      # which needs a reachable Docker daemon. ubuntu-latest ships one, running, by default, so
      # this should always no-op here — it exists so a daemon that is missing or misconfigured
      # fails at this clearly-named step with Docker's own error, instead of surfacing as a wall of
      # red tests (one per test in the Postgres collection, all citing the same root cause) deep
      # inside the Infrastructure.Tests run, or as a confusing hang.
      - name: Verify Docker is available (required for Testcontainers-backed tests)
        run: docker info

      # One project at a time, each writing a .trx named after itself. Running the
      # whole solution with a fixed LogFileName makes every project overwrite the
      # previous one's results — the report then shows only the last project's
      # tests and goes green having checked a fraction of the suite.
      #
      # `|| true` keeps the loop going past a red project so the report covers all
      # of them; the Report step is what fails the job.
      - name: Test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          count=0
          for proj in FlightAssistant.*.Tests/*.csproj; do
            name=$(basename "$(dirname "$proj")")
            echo "::group::$name"
            dotnet test "$proj" --configuration Release --no-build \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory "$GITHUB_WORKSPACE/TestResults" || true
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "EXPECTED_SUITES=$count" >> "$GITHUB_ENV"

      # Produces test-results.json for the admin panel's tests page (#291, A7) and
      # a table in the job summary so a reviewer sees the outcome without
      # downloading an artifact. Exits non-zero on any failed test, or if a project
      # produced no .trx at all.
      - name: Report
        run: >
          python3 .github/scripts/trx_to_json.py
          TestResults test-results.json "$EXPECTED_SUITES"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.json
            TestResults/**/*.trx
          retention-days: 30

      # spec/openapi.json is committed (#324) so every API change shows up as a
      # reviewable diff in the PR that causes it, and the admin panel can fetch a
      # fixed path instead of an expiring, run-id-keyed artifact. A committed spec
      # nobody can prove is current is worse than no spec, so this regenerates it
      # and fails the build if the committed file doesn't match byte-for-byte.
      #
      # `--no-build` reuses the compile the "Build" step above already did, so this
      # only pays for `dotnet publish`'s packaging and `dotnet tool restore` —
      # generation itself is sub-second (verified: SwaggerDoc uses a fixed Version,
      # no build stamp, so the output is deterministic).
      - name: Publish API for OpenAPI export
        run: dotnet publish FlightAssistant.API --configuration Release --no-build -o openapi-publish

      # Regenerates spec/openapi.json in place from the publish output above. The
      # dummy configuration block that lets the host boot for export lives once, in
      # this script — reused here and by development_flight-assistant-dev-api.yml's
      # "Export OpenAPI spec" step, rather than copied into this workflow too.
      - name: Regenerate OpenAPI spec
        run: scripts/generate-openapi.sh spec/openapi.json openapi-publish

      # A spec is a public-shaped document. It should never echo the dummy values
      # above (or anything else config-shaped) — assert it before trusting the diff
      # check below, since a byte-for-byte match on a leaking spec is no comfort.
      - name: Assert OpenAPI spec has no leaked credential-shaped values
        run: |
          if grep -Eio 'dummy|password|apikey|connectionstring|b2clogin|onmicrosoft' spec/openapi.json; then
            echo "::error::spec/openapi.json contains a value shaped like one of the dummy credentials scripts/generate-openapi.sh injects only to boot the host (see matches above). If this is a false positive, tighten the check in ci.yml — never commit a real credential to make it pass."
            exit 1
          fi

      # The one check that matters: does the committed file still match what the
      # current code produces? `git diff` against the just-regenerated working-tree
      # copy prints exactly what changed, not just that something did.
      - name: Verify spec/openapi.json is up to date
        run: |
          if ! git diff --exit-code -- spec/openapi.json; then
            echo "::error::spec/openapi.json is out of date (diff above). Regenerate it with 'scripts/generate-openapi.sh' from the repo root and commit the result — see CLAUDE.md."
            exit 1
          fi
